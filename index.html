<title>HomeCraft — Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ffb547' d='M12 3 2 12h3v8h5v-6h4v6h5v-8h3z'/%3E%3C/svg%3E">
<link rel="modulepreload" href="/a/app-RRQPWGJN.js">
<style>
:root{--demo-bar:28px;--hc-font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--paper-font-body1_-_font-family:var(--hc-font);--primary-color:#ffb547;--primary-text-color:#e8edf3;--secondary-text-color:#9aa7b6;--primary-background-color:#0d1522;--secondary-background-color:#131c2a;--card-background-color:#162131;--state-light-active-color:#ffb547;color-scheme:dark}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#1b2a3f 0%,#0d1522 70%,#090f18 100%);color:var(--primary-text-color);font-family:var(--hc-font);overflow:hidden;-webkit-text-size-adjust:100%}
homecraft-panel{position:fixed;left:0;right:0;bottom:0;top:var(--demo-bar);display:block;height:auto}
.demo-bar{position:fixed;top:0;left:0;right:0;height:var(--demo-bar);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;box-sizing:border-box;background:#0a111b;border-bottom:1px solid #1f2c3d;font-size:12.5px;color:#c9d3df;z-index:10;white-space:nowrap;overflow:hidden}
.demo-dot{width:7px;height:7px;border-radius:50%;background:#ffb547;box-shadow:0 0 8px #ffb547aa;flex:none}
.demo-sep{opacity:.5}
.demo-reset{font:inherit;color:#ffcf85;background:none;border:0;padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.demo-reset:hover,.demo-reset:focus-visible{color:#fff;outline:none}
.demo-lic{position:absolute;inset-inline-end:12px;opacity:.45;font-size:11px}
@media (max-width:900px){.demo-lic{display:none}}
.demo-note{position:fixed;left:50%;top:calc(var(--demo-bar) + 10px);transform:translate(-50%,-8px);max-width:min(560px,calc(100vw - 32px));padding:9px 14px;border-radius:10px;background:#1d2a3c;border:1px solid #33465f;color:#e8edf3;font-size:13px;line-height:1.35;box-shadow:0 8px 28px #0008;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:11;text-align:center}
.demo-note.on{opacity:1;transform:translate(-50%,0)}
.demo-splash{position:fixed;inset:var(--demo-bar) 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#9aa7b6;font-size:14px}
.demo-splash svg{width:56px;height:56px;opacity:.9}
.demo-splash i{display:block;width:160px;height:3px;border-radius:2px;background:#1f2c3d;overflow:hidden;position:relative}
.demo-splash i::after{content:"";position:absolute;inset:0;width:40%;background:#ffb547;border-radius:2px;animation:demo-run 1.1s ease-in-out infinite}
@keyframes demo-run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div class="demo-splash"><svg viewBox="0 0 24 24"><path fill="#ffb547" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg><i></i></div>
<noscript>HomeCraft demo needs JavaScript.</noscript>
<script type="module" src="/a/app-RRQPWGJN.js"></script>
<script src="/teller.js" defer></script>
</body>
</html>
